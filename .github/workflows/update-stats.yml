name: Update profile stats

# Regenera assets/stats.svg con datos frescos de la API. El panel se versiona
# en el repositorio a proposito: asi el README no depende de ningun servicio
# externo que pueda caerse y mostrar imagenes rotas.

on:
  schedule:
    - cron: "42 5 * * 1"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-stats.py
      - .github/workflows/update-stats.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate-stats.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile stats"
          file_pattern: assets/stats.svg
