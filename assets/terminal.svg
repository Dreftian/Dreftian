<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Consola de demostración de los proyectos de Dreftian">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16161f"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
    }
    .cmd  { fill: #e6e6f0; }
    .sign { fill: #a855f7; }
    .out  { fill: #7dd3fc; }
    .muted{ fill: #6b6b85; font-size: 12px; }
    .entry {
      animation: entry 9s ease-in-out infinite;
      opacity: 0;
    }
    .e2 { animation-delay: -3s; }
    .e3 { animation-delay: -6s; }
    @keyframes entry {
      0%   { opacity: 0; transform: translateY(4px); }
      8%   { opacity: 1; transform: translateY(0); }
      30%  { opacity: 1; transform: translateY(0); }
      38%  { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .glint { animation: glint 7s linear infinite; }
    @keyframes glint {
      0%   { transform: translateX(-320px); }
      100% { transform: translateX(1320px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .entry { animation: none; opacity: 1; }
      .e2, .e3 { display: none; }
      .cursor, .glint { animation: none; }
    }
  </style>

  <rect width="1000" height="300" rx="14" fill="#0b0b14"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect width="1000" height="48" rx="14" fill="url(#chrome)"/>
  <rect y="34" width="1000" height="14" fill="url(#chrome)"/>
  <line x1="0" y1="48" x2="1000" y2="48" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="24" r="6" fill="#febc2e"/>
  <circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text class="muted" x="90" y="29">dangelo@dreftian — ~/projects</text>

  <g class="entry e1">
    <text class="sign" x="40" y="92">$</text>
    <text class="cmd" x="60" y="92">tiancode --model local.gguf</text>
    <text class="out" x="60" y="120">✓ 14 especialistas listos · sin conexión</text>
  </g>

  <g class="entry e2">
    <text class="sign" x="40" y="166">$</text>
    <text class="cmd" x="60" y="166">dhtraduct transcribe --lang es</text>
    <text class="out" x="60" y="194">✓ 1.204 líneas · srt + vtt +ASS</text>
  </g>

  <g class="entry e3">
    <text class="sign" x="40" y="240">$</text>
    <text class="cmd" x="60" y="240">mod-assistant sync --all</text>
    <text class="out" x="60" y="268">✓ 1.312 mods · 41 categorías</text>
  </g>

  <text class="sign" x="40" y="290">$</text>
  <rect class="cursor" x="60" y="278" width="9" height="15" rx="1.5" fill="#a855f7"/>

  <g class="glint">
    <rect x="0" y="0" width="280" height="300" fill="url(#sheen)"/>
  </g>
</svg>
