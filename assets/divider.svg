<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="Separador">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .rail { stroke: #8b8ba7; opacity: 0.28; }
    .sweep { animation: sweep 9s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-240px); }
      100% { transform: translateX(1240px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sweep { animation: none; opacity: 0.35; }
    }
    @media (prefers-color-scheme: dark) {
      .rail { stroke: #ffffff; opacity: 0.16; }
    }
  </style>

  <line class="rail" x1="0" y1="12" x2="1000" y2="12" stroke-width="1"/>
  <g class="sweep">
    <line x1="0" y1="12" x2="220" y2="12" stroke="url(#beam)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="500" cy="12" r="2.5" fill="#a855f7" opacity="0.9"/>
</svg>
